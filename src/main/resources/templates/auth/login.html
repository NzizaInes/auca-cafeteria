<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — AUCA Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <h1>🍽️ AUCA Cafeteria</h1>
            <p>Queue Management System</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger"
             th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="alert alert-success"
             th:text="${logoutMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required/>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                Login
            </button>
        </form>

        <div class="alert alert-info" style="margin-top:20px; font-size:12px;">
            <strong>Demo Accounts:</strong><br/>
            student@auca.ac.rw / password123<br/>
            kitchen@auca.ac.rw / password123<br/>
            cashier@auca.ac.rw / password123<br/>
            admin@auca.ac.rw / admin123
        </div>
    </div>
</div>
</body>
</html>

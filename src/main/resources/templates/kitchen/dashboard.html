<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Kitchen Dashboard — AUCA Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div>
        <a class="navbar-brand" href="#">AUCA <span>Cafeteria</span></a>
        <div class="navbar-subtitle">Queue Management System</div>
    </div>
    <div class="navbar-user">
        <span>Kitchen Staff Portal</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Sign Out</button>
        </form>
    </div>
</nav>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">Navigation</div>
        <a th:href="@{/kitchen/dashboard}" class="active">Order Queue</a>
        <form th:action="@{/logout}" method="post" style="margin:0;padding:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;color:rgba(255,255,255,0.7);
                    cursor:pointer;font-size:13px;padding:11px 24px;width:100%;
                    text-align:left;border-left:3px solid transparent;">Sign Out</button>
        </form>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Kitchen Order Queue</h1>

        <div class="card">
            <div class="card-title">Orders to Prepare</div>
            <table class="table">
                <thead>
                <tr>
                    <th>Queue No.</th>
                    <th>Order #</th>
                    <th>Student</th>
                    <th>Items</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td><strong th:text="'Q-' + ${order.queueNumber}">Q-01</strong></td>
                    <td th:text="'#' + ${order.id}">#001</td>
                    <td th:text="${order.student.name}">Student</td>
                    <td th:text="${order.items.size()} + ' item(s)'">2</td>
                    <td>
                            <span th:class="'badge badge-' + ${order.status.toString().toLowerCase()}"
                                  th:text="${order.status}">Status</span>
                    </td>
                    <td>
                        <form th:action="@{/kitchen/order/{id}/status(id=${order.id})}"
                              method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="status" value="PREPARING"/>
                            <button type="submit" class="btn btn-primary btn-sm">
                                Start Preparing
                            </button>
                        </form>
                        <form th:action="@{/kitchen/order/{id}/status(id=${order.id})}"
                              method="post" style="display:inline;margin-left:6px;">
                            <input type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="status" value="READY"/>
                            <button type="submit" class="btn btn-success btn-sm">
                                Mark Ready
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="6"
                        style="text-align:center;color:var(--text-muted);padding:32px;">
                        No orders to prepare right now.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

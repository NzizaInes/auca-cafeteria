<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Reports — AUCA Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div>
        <a class="navbar-brand" href="#">AUCA <span>Cafeteria</span></a>
        <div class="navbar-subtitle">Queue Management System</div>
    </div>
    <div class="navbar-user">
        <span>Admin Portal</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Sign Out</button>
        </form>
    </div>
</nav>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">Navigation</div>
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/menu}">Manage Menu</a>
        <a th:href="@{/admin/users}">Manage Users</a>
        <a th:href="@{/admin/reports}" class="active">Reports</a>
        <form th:action="@{/logout}" method="post" style="margin:0;padding:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;color:rgba(255,255,255,0.7);
                    cursor:pointer;font-size:13px;padding:11px 24px;width:100%;
                    text-align:left;border-left:3px solid transparent;">Sign Out</button>
        </form>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Reports and Analytics</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" th:text="${allOrders.size()}">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card success">
                <div class="stat-number" th:text="${totalRevenue}">0</div>
                <div class="stat-label">Total Revenue (RWF)</div>
            </div>
            <div class="stat-card accent">
                <div class="stat-number" th:text="${pendingOrders}">0</div>
                <div class="stat-label">Pending Orders</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">All Orders</div>
            <table class="table">
                <thead>
                <tr>
                    <th>Order #</th>
                    <th>Student</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Queue No.</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order,s : ${allOrders}">
                    <td th:text="'#' + ${s.count}">#1</td>
                    <td th:text="${order.student.name}">Student</td>
                    <td>
                            <span th:each="item,iter : ${order.items}">
                                <span th:text="${item.name}">Item</span>
                                <span th:unless="${iter.last}">, </span>
                            </span>
                    </td>
                    <td th:text="${order.totalPrice} + ' RWF'">1500</td>
                    <td th:text="'Q-' + ${order.queueNumber}">Q-1</td>
                    <td>
                            <span th:class="'badge badge-' + ${order.status.toString().toLowerCase()}"
                                  th:text="${order.status}">Status</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(allOrders)}">
                    <td colspan="6"
                        style="text-align:center;color:var(--text-muted);padding:32px;">
                        No orders yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

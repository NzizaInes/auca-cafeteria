<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Edit Menu Item — AUCA Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" href="#">🍽️ AUCA <span>Cafeteria</span></a>
    <div class="navbar-user">
        <span>⚙️ Admin</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>
            <button type="submit"
                    style="background:none;border:none;color:white;
                           cursor:pointer;font-size:13px;">Logout</button>
        </form>
    </div>
</nav>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">Admin Panel</div>
        <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
        <a th:href="@{/admin/menu}" class="active">🍱 Manage Menu</a>
        <a th:href="@{/admin/users}">👥 Manage Users</a>
        <a th:href="@{/admin/reports}">📈 Reports</a>
        <form th:action="@{/logout}" method="post" style="margin:0;padding:0;">
            <input type="hidden" th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>
            <button type="submit"
                    style="background:none;border:none;
                           color:rgba(255,255,255,0.75);cursor:pointer;
                           font-size:13px;padding:12px 24px;
                           width:100%;text-align:left;">🚪 Logout</button>
        </form>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Edit Menu Item ✏️</h1>

        <div class="card">
            <div class="card-title">
                Editing: <strong th:text="${item.name}">Item Name</strong>
            </div>

            <form th:action="@{/admin/menu/{id}/update(id=${item.id})}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">

                    <div class="form-group">
                        <label class="form-label">Item Name *</label>
                        <input type="text" name="name"
                               class="form-control"
                               th:value="${item.name}"
                               required/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <input type="text" name="description"
                               class="form-control"
                               th:value="${item.description}"/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Price (RWF) *</label>
                        <input type="number" name="price"
                               class="form-control"
                               th:value="${item.price}"
                               min="0" required/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Category *</label>
                        <select name="category" class="form-control" required>
                            <option value="BREAKFAST"
                                    th:selected="${item.category == 'BREAKFAST'}">
                                Breakfast
                            </option>
                            <option value="LUNCH"
                                    th:selected="${item.category == 'LUNCH'}">
                                Lunch
                            </option>
                            <option value="DINNER"
                                    th:selected="${item.category == 'DINNER'}">
                                Dinner
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Current availability info -->
                <div class="alert alert-info" style="margin:16px 0;">
                    Current availability:
                    <strong th:text="${item.available} ? 'Available ' : 'Not Available'">
                        Status
                    </strong>
                    — Use the Toggle button on the menu page to change this.
                </div>

                <!-- Action Buttons -->
                <div style="display:flex;gap:12px;margin-top:8px;">
                    <a th:href="@{/admin/menu}"
                       class="btn btn-danger">
                        ✕ Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        💾 Save Changes
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>

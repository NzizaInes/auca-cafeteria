<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Admin Dashboard — AUCA Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" href="#">🍽️ AUCA <span>Cafeteria</span></a>
    <div class="navbar-user">
        <span>⚙️ Admin</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;color:white;cursor:pointer;font-size:13px;">Logout</button>
        </form>
    </div>
</nav>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">Admin Panel</div>
        <a th:href="@{/admin/dashboard}" class="active">📊 Dashboard</a>
        <a th:href="@{/admin/menu}">🍱 Manage Menu</a>
        <a th:href="@{/admin/users}">👥 Manage Users</a>
        <a th:href="@{/admin/reports}">📈 Reports</a>
        <form th:action="@{/logout}" method="post" style="margin:0;padding:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;color:rgba(255,255,255,0.75);cursor:pointer;font-size:13px;padding:12px 24px;width:100%;text-align:left;">🚪 Logout</button>
        </form>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Admin Dashboard 📊</h1>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" th:text="${totalOrders}">0</div>
                <div class="stat-label">Total Orders Today</div>
            </div>
            <div class="stat-card accent">
                <div class="stat-number" th:text="${totalUsers}">0</div>
                <div class="stat-label">Registered Users</div>
            </div>
            <div class="stat-card success">
                <div class="stat-number" th:text="${menuItems.size()}">0</div>
                <div class="stat-label">Menu Items</div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Menu Items Overview</div>
            <table class="table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Available</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${menuItems}">
                    <td th:text="${item.name}">Item</td>
                    <td th:text="${item.category}">Category</td>
                    <td th:text="${item.price} + ' RWF'">Price</td>
                    <td>
                        <span th:if="${item.available}" class="badge badge-paid">Yes</span>
                        <span th:unless="${item.available}" class="badge badge-cancelled">No</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/menu/{id}/toggle(id=${item.id})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-warning btn-sm">
                                Toggle
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

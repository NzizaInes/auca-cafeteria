<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Order Confirmed — AUCA Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div>
        <a class="navbar-brand" href="#">AUCA <span>Cafeteria</span></a>
        <div class="navbar-subtitle">Queue Management System</div>
    </div>
    <div class="navbar-user">
        <span>Student Portal</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Sign Out</button>
        </form>
    </div>
</nav>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">Navigation</div>
        <a th:href="@{/student/dashboard}">Dashboard</a>
        <a th:href="@{/student/menu}">Browse Menu</a>
        <a th:href="@{/student/order/track}" class="active">Track Order</a>
        <form th:action="@{/logout}" method="post" style="margin:0;padding:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;color:rgba(255,255,255,0.7);
                    cursor:pointer;font-size:13px;padding:11px 24px;width:100%;
                    text-align:left;border-left:3px solid transparent;">Sign Out</button>
        </form>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Order Confirmed</h1>

        <div class="queue-number-display">
            <div class="queue-label">Your Queue Number</div>
            <div class="queue-number" th:text="'Q-' + ${order.queueNumber}">Q-0</div>
            <div class="queue-label"
                 th:text="'Estimated wait: approximately ' + ${order.queueNumber * 5} + ' minutes'">
                Estimated wait
            </div>
        </div>

        <div class="card">
            <div class="card-title">Order Details</div>
            <table class="table">
                <thead>
                <tr><th>Item</th><th>Price</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.name}">Item</td>
                    <td th:text="${item.price} + ' RWF'">Price</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <td><strong>Total</strong></td>
                    <td><strong th:text="${order.totalPrice} + ' RWF'">Total</strong></td>
                </tr>
                </tfoot>
            </table>
        </div>

        <div class="alert alert-info">
            You will be notified when your meal is ready for collection.
        </div>

        <a th:href="@{/student/order/track}" class="btn btn-primary">
            Track My Order
        </a>
    </main>
</div>
</body>
</html>

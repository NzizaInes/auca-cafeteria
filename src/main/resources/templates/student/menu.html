<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Browse Menu — AUCA Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div>
        <a class="navbar-brand" href="#">AUCA <span>Cafeteria</span></a>
        <div class="navbar-subtitle">Queue Management System</div>
    </div>
    <div class="navbar-user">
        <span>Student Portal</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Sign Out</button>
        </form>
    </div>
</nav>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">Navigation</div>
        <a th:href="@{/student/dashboard}">Dashboard</a>
        <a th:href="@{/student/menu}" class="active">Browse Menu</a>
        <a th:href="@{/student/order/track}">Track Order</a>
        <form th:action="@{/logout}" method="post" style="margin:0;padding:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;color:rgba(255,255,255,0.7);
                    cursor:pointer;font-size:13px;padding:11px 24px;width:100%;
                    text-align:left;border-left:3px solid transparent;">Sign Out</button>
        </form>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Today's Menu</h1>

        <div class="menu-grid">
            <div class="menu-item-card" th:each="item : ${menuItems}">
                <div class="menu-item-image"></div>
                <div class="menu-item-body">
                    <div class="menu-item-name" th:text="${item.name}">Item</div>
                    <div class="menu-item-desc" th:text="${item.description}">Description</div>
                    <div class="menu-item-price" th:text="${item.price} + ' RWF'">Price</div>
                </div>
                <div class="menu-item-footer">
                    <form th:action="@{/student/order/add}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="itemId" th:value="${item.id}"/>
                        <button type="submit" class="btn btn-primary btn-block btn-sm">
                            + Add to Order
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top:24px;">
            <div class="card-title">Your Cart
                <span style="font-size:12px;color:var(--text-muted);font-weight:400;">
                    (<span th:text="${cartCount}">0</span> items)
                </span>
            </div>

            <div th:if="${cartItems != null and !#lists.isEmpty(cartItems)}">
                <table class="table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Item</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item,iter : ${cartItems}">
                        <td th:text="${iter.index + 1}">1</td>
                        <td th:text="${item.name}">Item</td>
                        <td th:text="${item.price} + ' RWF'">Price</td>
                        <td>
                            <form th:action="@{/student/order/remove}"
                                  method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <input type="hidden" name="index" th:value="${iter.index}"/>
                                <button type="submit" class="btn btn-danger btn-sm">
                                    Remove
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <td colspan="2"><strong>Total</strong></td>
                        <td colspan="2">
                            <strong th:text="${cartTotal} + ' RWF'">0</strong>
                        </td>
                    </tr>
                    </tfoot>
                </table>

                <div style="display:flex;gap:12px;margin-top:16px;">
                    <form th:action="@{/student/order/clear}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger">Clear Cart</button>
                    </form>
                    <form th:action="@{/student/order/place}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-success">
                            Place Order and Proceed to Payment
                        </button>
                    </form>
                </div>
            </div>

            <div th:if="${cartItems == null or #lists.isEmpty(cartItems)}"
                 style="color:var(--text-muted);padding:20px 0;">
                Your cart is empty. Add items from the menu above.
            </div>
        </div>
    </main>
</div>
</body>
</html>
